server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto  # <-- КЛЮЧЕВАЯ НАСТРОЙКА ДЛЯ WEBFLUX
  cloud:
    gateway:
      routes:
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
          filters:
            - RewritePath=/api/bookings/(?<segment>.*), /$\{segment}
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotels/**
          filters:
            - RewritePath=/api/hotels/(?<segment>.*), /api/hotels/$\{segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: mySuperSecretKeyForHotelBookingSystem1234567890

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-},%X{spanId:-}] ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n"
  level:
    org.springframework.cloud.gateway: INFO
    com.example.apigateway: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info